[tool.poetry]
name = "hermes"
version = "0.1.0"
description = "Hermes API for web scraping with AI"
authors = ["Jules <jules@example.com>"]
readme = "README.md"
packages = [{include = "hermes", from = "src"}]

[tool.poetry.dependencies]
python = "^3.12"
pydantic = "^2.0"
httpx = "^0.27.0"
beautifulsoup4 = "^4.12.0"
openai = "^1.0.0"
python-dotenv = "^1.0.0"
tenacity = "^8.2.0"

[tool.poetry.group.dev.dependencies]
ruff = "^0.3.0"
pytest = "^8.0.0"
pytest-asyncio = "^0.23.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = []
